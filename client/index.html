<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal pengetahuan lingkungan berbasis sumber teraudit." />
    <title>Basis Pengetahuan Lingkungan</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17251f;background:#f5f7f3;font-synthesis:none}
      *{box-sizing:border-box}body{margin:0;min-width:320px;background:#f5f7f3}a{color:inherit}button,input{font:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,5vw,72px);background:#07351f;color:#f7ffe9;border-bottom:1px solid #2c6443}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#d9f99d;color:#07351f;font-weight:800}.brand small{display:block;color:#a8cf9b;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.brand strong{font-size:16px}.toplinks{display:flex;gap:18px;align-items:center;font-size:13px}.toplinks a{text-decoration:none;color:#e5f6d7}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1440px;margin:auto}.sidebar{min-height:calc(100vh - 71px);padding:28px 18px;background:#07351f;color:#d9ead2}.sidebar h2{margin:0 10px 22px;color:#9ec68e;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.nav{display:grid;gap:6px}.nav a{padding:11px 12px;border-radius:10px;text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:#d9f99d;color:#07351f}.main{padding:clamp(22px,5vw,70px);min-width:0}.hero{max-width:900px;padding:clamp(26px,6vw,64px);border-radius:28px;background:linear-gradient(120deg,#07351f,#286340);color:#fff}.eyebrow{margin:0 0 14px;color:#d9f99d;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}.hero h1{max-width:760px;margin:0;font-size:clamp(38px,6vw,76px);line-height:1.02;letter-spacing:-.055em}.hero p{max-width:690px;color:#d7ebd2;font-size:16px;line-height:1.75}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.button{display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border:1px solid transparent;border-radius:10px;background:#d9f99d;color:#07351f;font-weight:750;text-decoration:none;cursor:pointer}.button.secondary{border-color:#b4d1b0;background:transparent;color:#07351f}.hero .button.secondary{border-color:#9ac7a2;color:#fff}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:44px 0 18px}.section-head h2{margin:0;font-size:28px;letter-spacing:-.03em}.muted{color:#63736a;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{padding:22px;border:1px solid #d9e3d7;border-radius:18px;background:#fff;box-shadow:0 10px 28px #16472b0d}.card:hover{border-color:#5d9e67;transform:translateY(-2px)}.card h3{margin:14px 0 8px;font-size:20px}.card p{margin:0;color:#63736a;line-height:1.65}.number{color:#277345;font-size:12px;font-weight:800;letter-spacing:.12em}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff7d6;color:#7a5a11;font-size:11px;font-weight:700}.content{max-width:980px}.back{display:inline-block;margin-bottom:22px;color:#277345;font-weight:700;text-decoration:none}.panel{margin-top:18px;padding:24px;border:1px solid #d9e3d7;border-radius:18px;background:#fff}.panel h2{margin-top:0}.panel p,.panel li{line-height:1.8;color:#4c5e53}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 10px;border-radius:999px;background:#edf5e9;color:#28623b;font-size:13px}.sources{background:#f1f8ed}.source{padding:11px 0;border-bottom:1px solid #d9e3d7;font-family:ui-monospace,monospace;font-size:12px;color:#4c6652}.searchbar{display:flex;gap:10px;margin:20px 0}.searchbar input{flex:1;padding:13px 15px;border:1px solid #cbd9c9;border-radius:10px;background:#fff}.empty{padding:36px;border:1px dashed #b8cbb8;border-radius:16px;text-align:center;color:#63736a;background:#fff}.footer{margin-top:60px;padding-top:20px;border-top:1px solid #d9e3d7;color:#718077;font-size:13px}@media(max-width:900px){.layout{display:block}.sidebar{min-height:0;padding:10px 14px;position:sticky;top:71px;z-index:4}.sidebar h2{display:none}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toplinks{display:none}}@media(max-width:620px){.main{padding:20px 15px}.hero{border-radius:20px;padding:25px 20px}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.searchbar{flex-direction:column}.topbar{padding:14px 16px}}
    </style>
  </head>

</html>
