name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "404.html"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend artifact
        run: pnpm run build
      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html
      - name: Refresh legacy Pages root artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/public/index.html ./index.html
          cp dist/public/404.html ./404.html
          rm -rf ./assets
          cp -R dist/public/assets ./assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html 404.html assets
          git diff --cached --quiet || git commit -m "chore: refresh GitHub Pages artifact [skip ci]"
          git push origin HEAD:main
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
